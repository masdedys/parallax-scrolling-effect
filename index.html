<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax-scrolling-effect by masdedys</title>
    <link rel="shortcut icon" href="img/logo.png" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .navbar{
            background: transparent;
            backdrop-filter: blur(8px);
        }
        .navbar .nav-link{
             mix-blend-mode: difference;
            font-weight: 400;
            font-size: 18px;
        }
        .navbar .nav-link:hover{
            color: yellow;
            font-weight: 500;
            font-size: 18px;
        }
        .navbar .nav-underline .nav-link.active{
            border-bottom: 2px solid white;
            color: white;
        }
        .copyright-item small {
        display: flex;
        height: 30px;
        padding: 0;
        margin: 0;
        justify-content: space-around;
        align-items: center;
        }
        .copyright small{
            font-size: 16px;
        }
        /* Hidding sections under 960px width */
        @media screen and (max-width: 600px) {
            /* Mengubah warna bingkai (border) tombol */
            .navbar-toggler {
                border-color: white !important;
            }
            /* Mengubah warna ikon hamburger */
            .navbar-toggler-icon {
                background-image: url("data:image/svg+xml;charset=utf8,%3Csvg viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath stroke='rgba%28255, 255, 255, 1%29' stroke-width='2' stroke-linecap='round' stroke-miterlimit='10' d='M4 7h22M4 15h22M4 23h22'/%3E%3C/svg%3E") !important;
        }}
    </style>
  </head>
  <body>
    <nav class="navbar fixed-top navbar-expand-lg nav-underline" style="height: 80px">
      <div class="container">
        <a class="navbar-brand" href="https://masdedys.github.io/">
            <img src="img/logo.png" alt="" class="d-inline-block align-top shadow" style="border-radius: 10%" />
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon text-white"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
          <ul class="navbar-nav ms-auto text-primary">
                <li class="nav-item">
                  <a class="nav-link" aria-current="page" href="#page1">Place 1</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#page2">Place 2</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#page3">Place 3</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#page4">Place 4</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#page5">Place 5</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#page6">Place 6</a>
                </li>
              </ul>
        </div>
      </div>
    </nav>
    <div class="container-fluid">
      <div class="row 1">
        <div class="col parallax page1" id="page1">
          <h1 class="title">Akashi Kaikyo bridge</h1>
        </div>
      </div>
      <div class="row 2">
        <div class="col parallax page2" id="page2">
          <h1>Brazilian Park Washuzan Highland</h1>
        </div>
      </div>
      <div class="row">
        <div class="col parallax page3" id="page3">
          <h1>Ochanomizu bridge</h1>
        </div>
      </div>
      <div class="row">
        <div class="col parallax page4" id="page4">
          <h1>Oyakaigan</h1>
        </div>
      </div>
      <div class="row">
        <div class="col parallax page5" id="page5">
          <h1>Yawatahama port</h1>
        </div>
      </div>
      <div class="row">
        <div class="col parallax page6" id="page6">
          <h1>Yunohira Onsen</h1>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

  </body>
</html>
